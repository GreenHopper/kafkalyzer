name: Build and Release kafkalyzer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  read-only-gate:
    name: Verify Read-Only Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Read-Only Invariant Check
        run: |
          chmod +x scripts/check_read_only.sh
          ./scripts/check_read_only.sh

      - name: Run Read-Only Gate Regression Tests
        run: bash scripts/test_check_read_only.sh

  run-tests:
    name: Run tests (Linux)
    needs: [read-only-gate]
    runs-on: ubuntu-latest # Keine if-Bedingung mehr: Tests sollen IMMER laufen (bei PRs, bei main-Pushes und vor Releases)
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev libblkid-dev liblzma-dev pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace

  kafka-integration:
    name: Kafka integration tests
    needs: [read-only-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev libblkid-dev liblzma-dev pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          cache-workspaces: "rust"

      - name: Run Kafka integration tests
        run: bash scripts/kafka_integration_tests.sh

  quality-gates:
    name: Source quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Der Size-Guard vergleicht die geaenderten Dateien mit der Revision,
      # von der der Change ausgeht; ohne sie waere "schon zu gross" nicht von
      # "gerade erst zu gross geworden" zu unterscheiden.
      KAFKALYZER_BASE_REF: >-
        ${{ github.event.pull_request.base.sha || 'refs/remotes/origin/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # size guard needs the merge base

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libsecret-1-dev libblkid-dev liblzma-dev \
            pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Pin matches pubspec.yaml / rust/Cargo.toml so the bindings-guard
      # regenerates with the same generator developers use locally.
      - name: Read flutter_rust_bridge version
        id: frb
        run: |
          v="$(sed -nE 's/^[[:space:]]*flutter_rust_bridge:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -1)"
          if [ -z "$v" ]; then
            echo "could not read flutter_rust_bridge version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install flutter_rust_bridge_codegen
        uses: taiki-e/install-action@v2
        with:
          tool: flutter_rust_bridge_codegen@${{ steps.frb.outputs.version }}

      # Same script a developer runs locally; it fails on the first finding.
      - name: Run quality gates
        run: bash scripts/quality_gates.sh

  build-linux:
    name: Build Linux
    needs: [run-tests, quality-gates, kafka-integration] # Wartet zwingend auf erfolgreiche Tests
    runs-on: ubuntu-latest
    # mcp-stdio-server spike 1.1: temporarily always run so rmcp builds on PRs
    # if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            # PR shallow clones often have no tags; git describe then exits 128 under set -e
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//') || true
            LATEST_TAG=${LATEST_TAG:-1.0.0}
            SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${LATEST_TAG}-dev${{ github.run_number }}.${SHA}" >> $GITHUB_ENV
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libsecret-1-dev libblkid-dev liblzma-dev \
            pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache Native Assets Rust target directory
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: >-
            ${{ runner.os }}-na-${{ hashFiles('rust/Cargo.lock',
            'rust/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-native-assets-

      - name: Build Linux app
        run: >-
          flutter build linux --release -v --build-name=${{ env.VERSION }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION="${{ env.VERSION
          }}+${{ github.run_number }}"

      - name: Build kafkalyzer-mcp
        env:
          KAFKALYZER_VERSION: ${{ env.VERSION }}
        run: |
          cargo build --release --manifest-path rust/Cargo.toml -p kafkalyzer-mcp
          test -f rust/target/release/kafkalyzer-mcp

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Post-build cleanup and Velopack packaging
        run: |
          if [ -f changelog.md ]; then
            cp changelog.md build/linux/x64/release/bundle/
          fi

          APPDIR="build/linux/x64/release/Kafkalyzer.AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/scalable/apps"

          cp -a build/linux/x64/release/bundle/. "$APPDIR/usr/bin/"
          cp rust/target/release/kafkalyzer-mcp "$APPDIR/usr/bin/kafkalyzer-mcp"
          test -x "$APPDIR/usr/bin/kafkalyzer-mcp"
          cp assets/logo.png "$APPDIR/Kafkalyzer.png"
          cp assets/logo.png "$APPDIR/.DirIcon"
          cp assets/logo.png "$APPDIR/usr/share/icons/hicolor/scalable/apps/Kafkalyzer.png"

          cat > "$APPDIR/Kafkalyzer.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=Kafkalyzer
          Comment=Kafkalyzer
          Icon=Kafkalyzer
          Exec=kafkalyzer
          StartupWMClass=Kafkalyzer
          Categories=Utility;
          EOF

          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          if [ ! -z "$APPIMAGE" ] && [ ! -z "$APPDIR" ]; then
              MD5=$(echo -n "file://$APPIMAGE" | md5sum | cut -d' ' -f1)
              cp "$APPDIR/Kafkalyzer.png" "$HOME/.cache/thumbnails/normal/$MD5.png" >/dev/null 2>&1
              cp "$APPDIR/Kafkalyzer.png" "$HOME/.cache/thumbnails/large/$MD5.png" >/dev/null 2>&1
              xdg-icon-resource forceupdate >/dev/null 2>&1
              if [ -d "$HOME/.local/share/applications" ]; then
                  for f in "$HOME/.local/share/applications/"*Kafkalyzer*.desktop; do
                      [ -f "$f" ] || continue
                      sed -i -e 's/^Name=Kafkalyzer (.*/Name=Kafkalyzer/' -e 's/^Comment=Kafkalyzer .*/Comment=Kafkalyzer/' -e '/^X-AppImage-Version=/d' "$f" 2>/dev/null || true
                  done
              fi
          fi
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}"/usr/bin/:"${PATH}"
          if [ "$1" = "--mcp" ]; then
              shift
              exec "${HERE}/usr/bin/kafkalyzer-mcp" "$@"
          fi
          EXEC=$(grep -e '^Exec=.*' "${HERE}"/*.desktop | head -n 1 | cut -d "=" -f 2 | cut -d " " -f 1 | sed 's/\\s/ /g')
          exec "${EXEC}" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          vpk pack -u Kafkalyzer --packTitle "Kafkalyzer" -v ${{ env.VERSION }} -p "$APPDIR" -e kafkalyzer --icon assets/logo.png -o velopack_release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-linux
          path: velopack_release/*

  build-macos:
    name: Build macOS
    needs: [run-tests, quality-gates, kafka-integration] # Wartet zwingend auf erfolgreiche Tests
    runs-on: macos-latest
    # mcp-stdio-server spike 1.1: temporarily always run so rmcp builds on PRs
    # if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            # PR shallow clones often have no tags; git describe then exits 128 under set -e
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//') || true
            LATEST_TAG=${LATEST_TAG:-1.0.0}
            SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${LATEST_TAG}-dev${{ github.run_number }}.${SHA}" >> $GITHUB_ENV
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          target: aarch64-apple-darwin
          cache-workspaces: "rust"

      - name: Cache Native Assets Rust target directory
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: >-
            ${{ runner.os }}-na-${{ hashFiles('rust/Cargo.lock',
            'rust/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-native-assets-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable Swift Package Manager integration
        run: flutter config --enable-swift-package-manager

      # --- APPLE CODE SIGNING SETUP (Auskommentiert) ---
      # - name: Install Apple Certificate
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.RUNNER_KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #
      #     echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode \
      #       -o $CERTIFICATE_PATH
      #     security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security list-keychain -d user -s $KEYCHAIN_PATH
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build macOS app
        run: >-
          flutter build macos --release -v --build-name=${{ env.VERSION }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION="${{ env.VERSION
          }}+${{ github.run_number }}"

      - name: Build kafkalyzer-mcp
        env:
          KAFKALYZER_VERSION: ${{ env.VERSION }}
        run: |
          # Match the packaged app's arch set (spike 1.3 / design D8).
          APP_BIN="build/macos/Build/Products/Release/kafkalyzer.app/Contents/MacOS/kafkalyzer"
          ARCHS="$(lipo -archs "$APP_BIN")"
          echo "app archs: $ARCHS"
          # arm64-only policy: fail here instead of in a krb5 cross-compile.
          if [ "$ARCHS" != arm64 ]; then echo "not arm64: $ARCHS"; exit 1; fi
          OUT_DIR="rust/target/mcp-macos"
          mkdir -p "$OUT_DIR"
          BINS=()
          for arch in $ARCHS; do
            case "$arch" in
              x86_64) target=x86_64-apple-darwin ;;
              arm64) target=aarch64-apple-darwin ;;
              *) echo "unsupported arch $arch"; exit 1 ;;
            esac
            cargo build --release --manifest-path rust/Cargo.toml -p kafkalyzer-mcp --target "$target"
            BINS+=("rust/target/$target/release/kafkalyzer-mcp")
          done
          if [ "${#BINS[@]}" -eq 1 ]; then
            cp "${BINS[0]}" "$OUT_DIR/kafkalyzer-mcp"
          else
            lipo -create "${BINS[@]}" -output "$OUT_DIR/kafkalyzer-mcp"
          fi
          test -f "$OUT_DIR/kafkalyzer-mcp"
          lipo -archs "$OUT_DIR/kafkalyzer-mcp"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Post-build packaging with Velopack
        run: |
          if [ -f changelog.md ]; then
            cp changelog.md build/macos/Build/Products/Release/kafkalyzer.app/Contents/Resources/ || true
          fi

          MCP_SRC="rust/target/mcp-macos/kafkalyzer-mcp"
          MCP_DST="build/macos/Build/Products/Release/kafkalyzer.app/Contents/MacOS/kafkalyzer-mcp"
          cp "$MCP_SRC" "$MCP_DST"
          test -x "$MCP_DST"

          # Standard-Pack-Befehl OHNE Signierung
          vpk pack -u Kafkalyzer --packTitle "Kafkalyzer" -v ${{ env.VERSION }} -p build/macos/Build/Products/Release/kafkalyzer.app -o velopack_release

          # --- SIGNATUR UND NOTARISIERUNG MIT VELOPACK (Auskommentiert) ---
          # vpk pack -u Kafkalyzer --packTitle "Kafkalyzer" -v ${{ env.VERSION }} -p build/macos/Build/Products/Release/kafkalyzer.app -o velopack_release \
          #   --signAppIdentity "Developer ID Application: YOUR NAME (TEAM_ID)" \
          #   --notaryEmail "${{ secrets.APPLE_ID }}" \
          #   --notaryPassword "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
          #   --notaryTeamId "${{ secrets.APPLE_TEAM_ID }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-macos
          path: velopack_release/*

  build-windows:
    name: Build Windows
    needs: [run-tests, quality-gates, kafka-integration] # Wartet zwingend auf erfolgreiche Tests
    runs-on: windows-latest
    # mcp-stdio-server spike 1.1: temporarily always run so rmcp builds on PRs
    # if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            # PR shallow clones often have no tags; git describe then exits 128 under set -e
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//') || true
            LATEST_TAG=${LATEST_TAG:-1.0.0}
            SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${LATEST_TAG}-dev${{ github.run_number }}.${SHA}" >> $GITHUB_ENV
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          cache-workspaces: "rust"

      - name: Export GitHub Actions cache API variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      - name: Cache Native Assets Rust target directory
        uses: actions/cache@v4
        with:
          path: .dart_tool/hooks_runner
          key: >-
            ${{ runner.os }}-na-${{ hashFiles('rust/Cargo.lock',
            'rust/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-native-assets-

      - name: Install OpenSSL and Cyrus SASL via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          vcpkg install cyrus-sasl:x64-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      - name: Configure OpenSSL, SASL and vcpkg paths
        shell: pwsh
        run: |
          $vcpkgInstallPath = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "OPENSSL_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "SASL2_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "SASL2_LIB_DIR=$vcpkgInstallPath/lib" >> $env:GITHUB_ENV
          echo "SASL2_INCLUDE_DIR=$vcpkgInstallPath/include" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$vcpkgInstallPath/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$vcpkgInstallPath" >> $env:GITHUB_ENV

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows app
        run: >-
          flutter build windows --release -v --build-name=${{ env.VERSION }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION="${{ env.VERSION
          }}+${{ github.run_number }}"

      - name: Build kafkalyzer-mcp
        env:
          KAFKALYZER_VERSION: ${{ env.VERSION }}
        shell: pwsh
        run: |
          cargo build --release --manifest-path rust/Cargo.toml -p kafkalyzer-mcp
          if (-not (Test-Path "rust/target/release/kafkalyzer-mcp.exe")) {
            throw "kafkalyzer-mcp.exe missing after release build"
          }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Post-build packaging with Velopack
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"

          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin/*.dll" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
          }

          $osslModulesTarget = "$releaseDir/ossl-modules"
          New-Item -ItemType Directory -Force -Path $osslModulesTarget | Out-Null

          if (Test-Path "$releaseDir/legacy.dll") {
            Move-Item "$releaseDir/legacy.dll" "$osslModulesTarget/" -Force
          }
          if (Test-Path "$vcpkgBin/ossl-modules") {
            Copy-Item "$vcpkgBin/ossl-modules/*.dll" -Destination $osslModulesTarget -Force -ErrorAction SilentlyContinue
          }

          Copy-Item "assets/cacert.pem" -Destination "$releaseDir/cacert.pem" -Force
          if (Test-Path "changelog.md") {
            Copy-Item "changelog.md" "$releaseDir/" -Force
          }

          Copy-Item "rust/target/release/kafkalyzer-mcp.exe" -Destination "$releaseDir/kafkalyzer-mcp.exe" -Force
          if (-not (Test-Path "$releaseDir/kafkalyzer-mcp.exe")) {
            throw "kafkalyzer-mcp.exe missing next to the app executable"
          }

          vpk pack -u Kafkalyzer --packTitle "Kafkalyzer" -v ${{ env.VERSION }} -p $releaseDir -e kafkalyzer.exe --icon windows/runner/resources/app_icon.ico -o velopack_release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-windows
          path: velopack_release/*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # WICHTIG: Explizite Berechtigung zum Erstellen des Releases
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-linux
          path: release-artifacts/linux

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-macos
          path: release-artifacts/macos

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-windows
          path: release-artifacts/windows

      # softprops/action-gh-release uploads assets in parallel via Octokit and
      # is prone to "other side closed" with many/large Velopack artifacts.
      # gh uploads sequentially and has built-in retries.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "Skipping release creation (ref is not a version tag)"
            exit 0
          fi

          TAG="${{ github.ref_name }}"

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --generate-notes \
              --title "$TAG"
          else
            echo "Release $TAG already exists; uploading/replacing assets"
          fi

          shopt -s nullglob
          files=(
            release-artifacts/linux/*
            release-artifacts/macos/*
            release-artifacts/windows/*
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found to upload"
            exit 1
          fi

          for file in "${files[@]}"; do
            [[ -f "$file" ]] || continue
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$file" --clobber --repo "${{ github.repository }}"; then
                uploaded=true
                break
              fi
              echo "Upload of $(basename "$file") failed (attempt $attempt/3)"
              sleep $((attempt * 5))
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload $file after 3 attempts"
              exit 1
            fi
          done
