name: Build and Release kafkalyzer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  run-tests:
    name: Run tests (Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --dart-define=APP_VERSION="1.0.0+${{ github.run_number }}"

      - name: Post-build cleanup and packaging
        run: |
          # Cleanup WASM assets from pdfrx package
          find build/linux/x64/release/bundle/ -name "pdfium.wasm" -delete || true
          find build/linux/x64/release/bundle/ -name "pdfium_worker.js" -delete || true
          find build/linux/x64/release/bundle/ -name "pdfium_client.js" -delete || true
          
          # Copy changelog.md if available
          if [ -f changelog.md ]; then
            cp changelog.md build/linux/x64/release/bundle/
          fi
          
          mkdir -p release
          tar -czf release/kafkalyzer-linux.tar.gz -C build/linux/x64/release bundle

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-linux
          path: release/kafkalyzer-linux.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin,aarch64-apple-darwin
          cache-workspaces: "rust"

      - name: Cache Cargokit macOS target directory
        uses: actions/cache@v4
        with:
          path: build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_kafkalyzer.build
          key: ${{ runner.os }}-cargokit-macos-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargokit-macos-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      - name: Build macOS app
        run: flutter build macos --release --dart-define=APP_VERSION="1.0.0+${{ github.run_number }}"

      - name: Post-build packaging
        run: |
          if [ -f changelog.md ]; then
            cp changelog.md build/macos/Build/Products/Release/kafkalyzer.app/Contents/Resources/ || true
          fi
          mkdir -p release
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/release/kafkalyzer-macos.zip" kafkalyzer.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-macos
          path: release/kafkalyzer-macos.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "rust"

      - name: Cache Cargokit Windows target directory
        uses: actions/cache@v4
        with:
          path: build/windows/x64/plugins/rust_lib_kafkalyzer/cargokit_build
          key: ${{ runner.os }}-cargokit-windows-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargokit-windows-

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: vcpkg_cache
          key: ${{ runner.os }}-vcpkg-openssl-sasl-v1

      - name: Install OpenSSL and Cyrus SASL via vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg_cache" | Out-Null
          vcpkg install openssl:x64-windows
          vcpkg install cyrus-sasl:x64-windows
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache

      - name: Configure OpenSSL, SASL and vcpkg paths
        shell: pwsh
        run: |
          $vcpkgInstallPath = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "OPENSSL_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "SASL2_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "SASL2_LIB_DIR=$vcpkgInstallPath/lib" >> $env:GITHUB_ENV
          echo "SASL2_INCLUDE_DIR=$vcpkgInstallPath/include" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$vcpkgInstallPath/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$vcpkgInstallPath" >> $env:GITHUB_ENV

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release --dart-define=APP_VERSION="1.0.0+${{ github.run_number }}"

      - name: Post-build packaging
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"
          
          # Delete unnecessary WASM assets from pdfrx package
          Remove-Item -Path "$releaseDir/data/flutter_assets/packages/pdfrx/assets/pdfium.wasm" -ErrorAction SilentlyContinue
          Remove-Item -Path "$releaseDir/data/flutter_assets/packages/pdfrx/assets/pdfium_worker.js" -ErrorAction SilentlyContinue
          Remove-Item -Path "$releaseDir/data/flutter_assets/packages/pdfrx/assets/pdfium_client.js" -ErrorAction SilentlyContinue
          
          # Copy vcpkg dynamic runtime DLLs
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin/*.dll" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
          }
          
          # Create and copy ossl-modules for legacy provider (OpenSSL requirements)
          $osslModulesTarget = "$releaseDir/ossl-modules"
          New-Item -ItemType Directory -Force -Path $osslModulesTarget | Out-Null
          
          # Move legacy.dll to ossl-modules
          if (Test-Path "$releaseDir/legacy.dll") {
            Move-Item "$releaseDir/legacy.dll" "$osslModulesTarget/" -Force
          }
          
          # Sync other modules if available
          if (Test-Path "$vcpkgBin/ossl-modules") {
            Copy-Item "$vcpkgBin/ossl-modules/*.dll" -Destination $osslModulesTarget -Force -ErrorAction SilentlyContinue
          }
          
          # Copy CA Certificates
          Copy-Item "assets/cacert.pem" -Destination "$releaseDir/cacert.pem" -Force
          
          # Copy changelog.md if available
          if (Test-Path "changelog.md") {
            Copy-Item "changelog.md" "$releaseDir/" -Force
          }
          
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "release/kafkalyzer-windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-windows
          path: release/kafkalyzer-windows.zip

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-linux
          path: release-artifacts

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-macos
          path: release-artifacts

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-windows
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/kafkalyzer-linux.tar.gz
            release-artifacts/kafkalyzer-macos.zip
            release-artifacts/kafkalyzer-windows.zip
          draft: true
          generate_release_notes: true
