name: Build and Release kafkalyzer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  run-tests:
    name: Run tests (Linux)
    runs-on: ubuntu-latest # Keine if-Bedingung mehr: Tests sollen IMMER laufen (bei PRs, bei main-Pushes und vor Releases)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Run Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

  build-linux:
    name: Build Linux
    needs: [run-tests] # Wartet zwingend auf erfolgreiche Tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
            LATEST_TAG=${LATEST_TAG:-1.0.0}
            SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${LATEST_TAG}-dev${{ github.run_number }}.${SHA}" >> $GITHUB_ENV
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev pkg-config libssl-dev libsasl2-dev libz-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "rust"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release --dart-define=APP_VERSION="${{ env.VERSION }}+${{ github.run_number }}"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Post-build cleanup and Velopack packaging
        run: |
          find build/linux/x64/release/bundle/ -name "pdfium.wasm" -delete || true
          find build/linux/x64/release/bundle/ -name "pdfium_worker.js" -delete || true
          find build/linux/x64/release/bundle/ -name "pdfium_client.js" -delete || true

          if [ -f changelog.md ]; then
            cp changelog.md build/linux/x64/release/bundle/
          fi

          vpk pack -u Kafkalyzer -v ${{ env.VERSION }} -p build/linux/x64/release/bundle -e kafkalyzer --icon assets/logo-transparent.png -o velopack_release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-linux
          path: velopack_release/*

  build-macos:
    name: Build macOS
    needs: [run-tests] # Wartet zwingend auf erfolgreiche Tests
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
            LATEST_TAG=${LATEST_TAG:-1.0.0}
            SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${LATEST_TAG}-dev${{ github.run_number }}.${SHA}" >> $GITHUB_ENV
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-apple-darwin,aarch64-apple-darwin
          cache-workspaces: "rust"

      - name: Cache Cargokit macOS target directory
        uses: actions/cache@v4
        with:
          path: build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_kafkalyzer.build
          key: ${{ runner.os }}-cargokit-macos-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargokit-macos-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager integration
        run: flutter config --no-enable-swift-package-manager

      # --- APPLE CODE SIGNING SETUP (Auskommentiert) ---
      # - name: Install Apple Certificate
      #   env:
      #     BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      #     P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     KEYCHAIN_PASSWORD: ${{ secrets.RUNNER_KEYCHAIN_PASSWORD }}
      #   run: |
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #
      #     security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
      #
      #     echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
      #     security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security list-keychain -d user -s $KEYCHAIN_PATH
      #     security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build macOS app
        run: flutter build macos --release --dart-define=APP_VERSION="${{ env.VERSION }}+${{ github.run_number }}"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Post-build packaging with Velopack
        run: |
          if [ -f changelog.md ]; then
            cp changelog.md build/macos/Build/Products/Release/kafkalyzer.app/Contents/Resources/ || true
          fi

          # Standard-Pack-Befehl OHNE Signierung
          vpk pack -u Kafkalyzer -v ${{ env.VERSION }} -p build/macos/Build/Products/Release/kafkalyzer.app -o velopack_release

          # --- SIGNATUR UND NOTARISIERUNG MIT VELOPACK (Auskommentiert) ---
          # vpk pack -u Kafkalyzer -v ${{ env.VERSION }} -p build/macos/Build/Products/Release/kafkalyzer.app -o velopack_release \
          #   --signAppIdentity "Developer ID Application: YOUR NAME (TEAM_ID)" \
          #   --notaryEmail "${{ secrets.APPLE_ID }}" \
          #   --notaryPassword "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
          #   --notaryTeamId "${{ secrets.APPLE_TEAM_ID }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-macos
          path: velopack_release/*

  build-windows:
    name: Build Windows
    needs: [run-tests] # Wartet zwingend auf erfolgreiche Tests
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')
            LATEST_TAG=${LATEST_TAG:-1.0.0}
            SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${LATEST_TAG}-dev${{ github.run_number }}.${SHA}" >> $GITHUB_ENV
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: "rust"

      - name: Export GitHub Actions cache API variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL)
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN)

      - name: Cache Cargokit Windows target directory
        uses: actions/cache@v4
        with:
          path: build/windows/x64/plugins/rust_lib_kafkalyzer/cargokit_build
          key: ${{ runner.os }}-cargokit-windows-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargokit-windows-

      - name: Install OpenSSL and Cyrus SASL via vcpkg
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          vcpkg install cyrus-sasl:x64-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      - name: Configure OpenSSL, SASL and vcpkg paths
        shell: pwsh
        run: |
          $vcpkgInstallPath = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows"
          echo "OPENSSL_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "SASL2_DIR=$vcpkgInstallPath" >> $env:GITHUB_ENV
          echo "SASL2_LIB_DIR=$vcpkgInstallPath/lib" >> $env:GITHUB_ENV
          echo "SASL2_INCLUDE_DIR=$vcpkgInstallPath/include" >> $env:GITHUB_ENV
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$vcpkgInstallPath/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$vcpkgInstallPath" >> $env:GITHUB_ENV

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release --dart-define=APP_VERSION="${{ env.VERSION }}+${{ github.run_number }}"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Post-build packaging with Velopack
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin"

          Remove-Item -Path "$releaseDir/data/flutter_assets/packages/pdfrx/assets/pdfium.wasm" -ErrorAction SilentlyContinue
          Remove-Item -Path "$releaseDir/data/flutter_assets/packages/pdfrx/assets/pdfium_worker.js" -ErrorAction SilentlyContinue
          Remove-Item -Path "$releaseDir/data/flutter_assets/packages/pdfrx/assets/pdfium_client.js" -ErrorAction SilentlyContinue

          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin/*.dll" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
          }

          $osslModulesTarget = "$releaseDir/ossl-modules"
          New-Item -ItemType Directory -Force -Path $osslModulesTarget | Out-Null

          if (Test-Path "$releaseDir/legacy.dll") {
            Move-Item "$releaseDir/legacy.dll" "$osslModulesTarget/" -Force
          }
          if (Test-Path "$vcpkgBin/ossl-modules") {
            Copy-Item "$vcpkgBin/ossl-modules/*.dll" -Destination $osslModulesTarget -Force -ErrorAction SilentlyContinue
          }

          Copy-Item "assets/cacert.pem" -Destination "$releaseDir/cacert.pem" -Force
          if (Test-Path "changelog.md") {
            Copy-Item "changelog.md" "$releaseDir/" -Force
          }

          vpk pack -u Kafkalyzer -v ${{ env.VERSION }} -p $releaseDir -e kafkalyzer.exe --icon windows/runner/resources/app_icon.ico -o velopack_release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafkalyzer-windows
          path: velopack_release/*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write # WICHTIG: Explizite Berechtigung zum Erstellen des Releases
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-linux
          path: release-artifacts/linux

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-macos
          path: release-artifacts/macos

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: kafkalyzer-windows
          path: release-artifacts/windows

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/linux/*
            release-artifacts/macos/*
            release-artifacts/windows/*
          draft: false
          generate_release_notes: true
