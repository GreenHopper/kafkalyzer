[package]
name = "kafkalyzer-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "kafkalyzer_mcp"
path = "src/lib.rs"

[[bin]]
name = "kafkalyzer-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
env_logger = "0.11"
kafkalyzer-core = { path = "../kafkalyzer-core" }
kafkalyzer-kafka = { path = "../kafkalyzer-kafka" }
kafkalyzer-profiles = { path = "../kafkalyzer-profiles" }
log = "0.4"
rmcp = { version = "3.11.0", default-features = false, features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "io-std", "sync", "time", "process", "io-util"] }

[[test]]
name = "protocol"
path = "tests/protocol.rs"
