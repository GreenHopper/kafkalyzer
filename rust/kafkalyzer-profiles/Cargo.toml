[package]
name = "kafkalyzer-profiles"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.100"
kafkalyzer-core = { path = "../kafkalyzer-core" }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
log = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
