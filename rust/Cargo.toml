[package]
name = "rust_lib_kafkalyzer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = [
    "kafkalyzer-core",
    "kafkalyzer-kafka",
]

[dependencies]
anyhow = "1.0.100"
flutter_rust_bridge = "=2.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["full"] }
kafkalyzer-core = { path = "kafkalyzer-core" }
kafkalyzer-kafka = { path = "kafkalyzer-kafka" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
