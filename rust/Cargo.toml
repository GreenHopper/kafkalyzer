[package]
name = "rust_lib_kafkalyzer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[workspace]
members = [
    ".",
    "kafkalyzer-core",
    "kafkalyzer-kafka"
]

[dependencies]
flutter_rust_bridge = "=2.11.1"
kafkalyzer-core = { path = "kafkalyzer-core" }
kafkalyzer-kafka = { path = "kafkalyzer-kafka" }
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
anyhow = "1.0.100"
chrono = "0.4"
regex = "1.12.2"
log = "0.4"
env_logger = "0.11"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
