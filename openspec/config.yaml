schema: spec-driven

# Project context
# This is shown to AI when creating artifacts.
context: |
  Tech Stack:
    - Frontend: Flutter (Dart 3.x) targeting cross-platform desktop (Linux, macOS, Windows).
      - State Management & DI: get_it, watch_it, ChangeNotifier, ValueNotifier.
      - Navigation & Routing: go_router.
      - Data Storage & Persistence: shared_preferences (local JSON/plist stores).
      - Styling & Theming: flex_color_scheme, google_fonts, Material 3.
      - UI Libraries: material_ui, data_table_2, timelines_plus, json_explorer, file_picker.
    - Backend: Rust Cargo Workspace located under `rust/`.
      - `rust_lib_kafkalyzer`: Main bridge crate / API wrapper for Dart integration.
      - `kafkalyzer-core`: Pure Rust library for AS400 decoding and Avro conversions.
      - `kafkalyzer-kafka`: Native Kafka transport library (connection, consumer, rdkafka wrapper).
    - Bridge Layer: communication generated via flutter_rust_bridge v2.

  Key Guidelines & Architecture:
    - Separation of Concerns: Decouple purely computational logic (e.g., kafkalyzer-core decoding, schemas) from platform-dependent native/I/O libraries like rdkafka and openssl (kafkalyzer-kafka) to ease compilation, cross-compilation (e.g., Docker-based Windows builds), and unit testing.
    - Bridge Boundary Type Isolation (Orphan Rule): All structs passed directly between Rust and Dart (e.g., ClusterProfile, KafkaMessage, ConsumerLag) must be defined locally in the main bridge crate (rust_lib_kafkalyzer under `rust/src/api/`) and mapped to/from domain types at the boundary.
    - Code Quality & Style:
      - Limit line length to a maximum of 120 characters for both Dart and Rust source files.
      - Format Dart code strictly using `dart format`.
      - Format Rust code strictly using `cargo fmt`.
      - Use structured logging (via Dart's `logger` or `developer.log`) instead of plain `print` statements.
      - Handle all potential exceptions and errors gracefully; do not let operations fail silently.

    - Performance & High-Throughput Engineering:
      - Hot Loops & Polling: Never compile regular expressions (`Regex::new`), perform blocking async operations (`block_on`), or execute sync file I/O (`writeAsStringSync`) inside message consumption or polling loops. Pre-compile patterns once outside the loop.
      - Stream Throttling: Streaming data from native Rust streams to Dart UI must be throttled or batched (e.g. 50ms–100ms intervals). Never invoke `notifyListeners()` or trigger widget re-renders per individual message at Kafka throughput.
      - Data Structures: Avoid $O(N)$ list operations (such as prepending via `insert(0, ...)`) on message collections in Dart. Prefer append operations, ring buffers, or reversed indexing.
      - Shared Runtimes & Caches: Prefer shared or static Tokio runtimes and thread-safe caches (e.g., for Schema Registry schema lookups) over creating new runtime instances per invocation.
      - Lazy UI Formatting: Avoid eager string transformations, date formatting, or pretty-printing across entire datasets upfront; defer formatting lazily to viewport item builders.

    - Kafka Consumer Resilience:
      - Partition Completion: Always set `enable.partition.eof=true` and treat `PartitionEOF` as the authoritative end-of-partition signal. Never infer completion from offset arithmetic (`last_offset + 1 >= high_watermark`) — compacted (`compact,delete`) and transactional topics contain offset gaps (compaction, transaction control markers, aborted records) where offsets are never delivered to clients.
      - Idle Is Not Done: Never abandon a partition because it was idle for N seconds; under fetch skew or broker throttling, sparse partitions can starve while data is still pending. On prolonged idle, re-query watermarks to distinguish "range deleted by retention" (finalize) from "data still pending" (keep polling).
      - No Blocking RPCs in Poll Loops: Completion checks and progress reporting inside poll loops must operate on in-memory state only; per-iteration network calls (e.g. `fetch_watermarks` per partition) starve `consumer.poll()` and freeze intake.
      - Prefetch Memory: Cap `queued.max.messages.kbytes` explicitly (librdkafka defaults to 64MB per partition, which can balloon to hundreds of MB on many-partition topics).
      - Closed Sink Handling: When a `StreamSink` to Dart reports a closed channel (user stopped the stream), exit the poll loop cleanly and immediately; never attempt further sends or log through the closed sink.

    - UI & UX:
        - Material UI Elements: The Flutter package `package:material_ui/material_ui.dart` MUST be used for all Material UI elements.
        - All asynchronous UI actions (e.g., fetching Kafka messages, cluster connection) MUST provide visual feedback (e.g., CircularProgressIndicator or loading states).
        - Errors during UI actions must be reported to the user via SnackBars or dialogs instead of failing silently in the logs.
        - Reuse: Existing UI components like `MessageDetailsDialog` should be reused to maintain visual and functional consistency.

    - Localization:
        - All user-facing strings must be localized using `AppLocalizations` (via `.arb` files). Hardcoded strings in UI code are prohibited.

# Per-artifact generation rules
rules:
  proposal:
    - Clearly document the "Why", "What", and "How" of the changes.
    - Explicitly detail any new, modified, or deleted capabilities.
  design:
    - Material UI Elements: Ensure all Material UI elements use `package:material_ui/material_ui.dart`.
    - Do not modify existing Dart/Flutter UI code unless explicitly requested or necessary.
    - Performance Guardrails: Design streaming APIs and UI consumers with throttling/batching, amortized $O(1)$ updates, and non-blocking I/O.
    - Maintain backwards compatibility of all existing Flutter/Dart integrations and Rust-Dart API signatures.
    - Status Access: For accessing global state (like the active cluster or settings), prefer using `ActiveConnectionController` or `getIt` over deep prop-drilling unless a widget is purely presentational.
    - Detail design choices, state flow, and any alternatives considered.
  specs:
    - Delta Documentation: When modifying existing capabilities, clearly distinguish between `ADDED Requirements`, `MODIFIED Requirements`, and `DELETED Requirements`.
  tasks:
    - Break down execution steps logically by Rust workspace crates first, then bridge generation, and finally Dart/Flutter integration.
    - Verify compilation and run tests at each incremental step to avoid cumulative errors.
